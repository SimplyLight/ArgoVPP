[project]
name = "argovpp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SimplyLight", email = "330010034+SimplyLight@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "trimesh>=5.1.1",
]

[project.scripts]
argovpp = "argovpp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
